<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f6f8"><title>오늘의 턱걸이</title>
<style>
:root{--ink:#18202e;--muted:#778091;--line:#e6e8ee;--paper:#fff;--bg:#f5f6f8;--blue:#2857d9;--blue-dark:#163da9;--blue-pale:#e9efff;--green:#17804c;--red:#b84040}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:760px;margin:auto;padding:22px 18px 48px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}.week{font-size:13px;font-weight:750;background:#e9ebf0;padding:8px 12px;border-radius:99px}.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:clamp(20px,5vw,34px);box-shadow:0 12px 35px #23304a0a}.center{text-align:center}.eyebrow{color:var(--muted);font-size:14px;font-weight:700}.headline{font-size:clamp(28px,6vw,42px);line-height:1.15;letter-spacing:-.045em;margin:9px 0 8px}.desc{color:var(--muted);margin:0 auto;max-width:460px}.circle{width:clamp(170px,45vw,220px);height:clamp(170px,45vw,220px);border:0;border-radius:50%;background:var(--blue);color:white;display:grid;place-content:center;margin:26px auto 0;cursor:pointer;box-shadow:0 16px 32px #2857d933;transition:transform .15s,background .15s}.circle:hover{background:var(--blue-dark);transform:scale(1.025)}.circle:active{transform:scale(.98)}.circle .big{font-size:25px;font-weight:850;letter-spacing:-.03em}.circle .small{font-size:13px;opacity:.82;margin-top:4px}.progressline{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.steps{display:flex;gap:5px}.steps i{width:26px;height:6px;border-radius:8px;background:#e5e8ef}.steps i.on{background:var(--blue)}.targetbox{background:#f4f6fb;border-radius:19px;padding:20px;margin:20px 0}.targetbox .count{font-size:68px;font-weight:900;letter-spacing:-.07em;line-height:1.05}.targetbox .label{color:var(--muted);font-size:14px}.row{display:flex;gap:10px;margin-top:18px}.btn{border:1px solid var(--line);border-radius:13px;padding:13px 17px;background:white;color:var(--ink);font:inherit;font-weight:750;cursor:pointer}.btn.primary{background:var(--blue);color:white;border-color:var(--blue);flex:1}.btn.primary:hover{background:var(--blue-dark)}.btn:disabled{opacity:.4;cursor:default}.timer{font-size:clamp(60px,14vw,90px);font-weight:850;letter-spacing:-.065em;font-variant-numeric:tabular-nums;line-height:1.1;margin:22px 0 10px}.timer.running{color:var(--blue)}.finish{width:100%;padding:18px;border:0;border-radius:15px;background:var(--ink);color:#fff;font:inherit;font-size:19px;font-weight:850;cursor:pointer;margin-top:18px}.inputrow{display:flex;gap:10px;align-items:center;margin:20px auto;max-width:370px}.inputrow input{min-width:0;width:100%;font:inherit;font-size:21px;font-weight:800;text-align:center;border:1px solid var(--line);border-radius:13px;padding:13px}.inputrow span{white-space:nowrap;color:var(--muted)}.note{background:#f4f6fb;border-radius:14px;padding:13px 15px;color:#525e73;font-size:14px;margin-top:18px}.note.good{background:#ebf8f0;color:#17643b}.note.bad{background:#fff0ee;color:#9c3935}.rest{font-size:54px;font-weight:850;font-variant-numeric:tabular-nums;margin:15px 0}.tablecard{margin-top:16px;padding:18px 20px}.tabletop{display:flex;justify-content:space-between;align-items:center;gap:8px}.tabletop h2{font-size:16px;margin:0}.toggle{border:0;background:none;color:var(--blue);font:inherit;font-size:13px;font-weight:750;cursor:pointer}.tablewrap{overflow:auto;margin-top:13px}table{border-collapse:collapse;min-width:700px;width:100%;text-align:center;font-size:12px}th,td{padding:7px 5px;border-bottom:1px solid var(--line);color:#9299a5}th{background:#f7f8fa;color:#737c8b}td.label,th.label{text-align:left;position:sticky;left:0;background:#fff;font-weight:750;color:#667080}td.focus{background:#244fc7!important;color:#fff!important;font-weight:900;border-radius:5px}td.setfocus{color:#202a3b!important;font-weight:900;background:#f0f2f6}td.focus.setfocus{background:#244fc7!important;color:#fff!important}.tablehidden{display:none}.bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:18px}.tiny{font-size:12px;color:var(--muted)}.hidden{display:none!important}.completion{font-size:48px;margin:16px 0}.records{font-size:13px;color:var(--muted);margin-top:12px}.linkbtn{color:var(--blue);background:none;border:0;font:inherit;font-size:13px;cursor:pointer;font-weight:700}@media(max-width:500px){.app{padding:15px 12px 35px}.head{margin-bottom:12px}.card{border-radius:21px}.row .btn{padding:12px 13px}.bottom{align-items:flex-start}}
/* Material 3 inspired tokens and component shapes */
:root{--ink:#1b1b1f;--muted:#5f6368;--line:#c5c6d0;--paper:#fffbfe;--bg:#f7f2fa;--blue:#6750a4;--blue-dark:#4f378b;--blue-pale:#eaddff;--green:#386a20;--red:#b3261e;--md-surface:#fffbfe;--md-surface-container:#f3edf7;--md-outline-variant:#cac4d0}
body{background:var(--bg);color:var(--ink);font-family:Roboto,"Noto Sans KR",system-ui,sans-serif;letter-spacing:.01em}
.card{background:var(--paper);border-color:transparent;border-radius:28px;box-shadow:0 1px 2px #1b1b1f1a}
.tablecard{background:var(--md-surface-container);border-radius:24px}
.btn{border-radius:20px;min-height:48px;border-color:var(--line);transition:background .18s,box-shadow .18s,transform .18s}
.btn:hover{box-shadow:0 2px 5px #1b1b1f26}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover,.circle:hover{background:var(--blue-dark)}
.circle{background:var(--blue);border-radius:50%;box-shadow:0 4px 10px #1b1b1f30}
.week{background:var(--blue-pale);color:#381e72}
.targetbox,.note{background:var(--md-surface-container);border-radius:24px}
.note.good{background:#e8f5df;color:#1d3b10}.note.bad{background:#f9dedc;color:#410e0b}
.inputrow input{border:1px solid var(--muted);border-radius:4px 4px 0 0;background:var(--md-surface-container);border-bottom:2px solid var(--blue)}
.finish{border-radius:20px;background:var(--blue);min-height:56px}.finish:hover{background:var(--blue-dark)}
.steps i{border-radius:99px}.steps i.on{background:var(--blue)}
td.focus{background:var(--blue)!important}
.keypad-display{display:flex;justify-content:center;align-items:baseline;gap:8px;margin:14px auto 12px;color:var(--ink);font-size:52px;font-weight:850;line-height:1.15;font-variant-numeric:tabular-nums}.keypad-display small{font-size:16px;color:var(--muted);font-weight:650}.keypad{display:grid;grid-template-columns:repeat(3,minmax(64px,88px));justify-content:center;gap:9px;margin:0 auto;max-width:300px}.key{height:62px;border:0;border-radius:22px;background:var(--md-surface-container);color:var(--ink);font:700 22px Roboto,"Noto Sans KR",system-ui,sans-serif;cursor:pointer;touch-action:manipulation}.key:hover{background:var(--blue-pale)}.key:active{transform:scale(.96);background:var(--blue-pale)}.key[data-key="clear"],.key[data-key="back"]{font-size:14px;color:var(--blue)}.finish:disabled{opacity:.45;cursor:default}
.rep-hero{display:flex;align-items:baseline;justify-content:center;gap:7px;margin:clamp(30px,9vh,76px) 0 clamp(32px,9vh,78px);font-size:clamp(120px,30vw,190px);font-weight:900;letter-spacing:-.085em;line-height:.95;color:var(--blue)}.rep-hero small{font-size:clamp(28px,8vw,42px);letter-spacing:-.03em;font-weight:750}
.rest{font-size:clamp(100px,26vw,170px);font-weight:850;letter-spacing:-.07em;margin:clamp(42px,16vh,130px) 0 clamp(48px,15vh,120px);color:var(--blue);line-height:1;font-variant-numeric:tabular-nums}
</style></head><body><main class="app">
<header class="head"><div class="brand">Pull-up routine</div><div class="week" id="weekBadge">2주차</div></header>
<section class="card center" id="screen"></section>
<section class="card tablecard"><div class="tabletop"><h2>전체 루틴표 <span class="tiny">· 현재 할 부분을 강조해요</span></h2><button class="toggle" id="tableToggle">표 펼치기</button></div><div class="tablewrap tablehidden" id="tableWrap"><table id="planTable"></table></div></section>
<div class="bottom"><span class="tiny" id="weekProgress"></span><button class="linkbtn" id="resetAll">기록 초기화</button></div></main>
<script>
const plan={2:[6,5,5,4,3],3:[7,6,5,4,4],4:[8,6,5,5,4],5:[8,7,5,5,5],6:[9,7,6,5,5],7:[10,7,6,5,5],8:[10,8,6,6,5],9:[11,8,6,6,6],10:[12,9,7,6,6],11:[12,9,7,7,6],12:[13,9,8,7,7],13:[14,10,8,7,7],14:[14,10,8,8,7],15:[15,11,9,8,8],16:[16,11,9,9,8],17:[16,11,10,9,9],18:[17,12,10,9,9],19:[18,12,10,10,10],20:[19,12,11,10,10],21:[20,12,11,11,10],22:[20,12,11,11,12],23:[21,13,12,11,11],24:[22,13,12,12,11],25:[22,13,12,12,12],26:[23,13,13,12,12],27:[24,14,13,13,13],28:[24,14,13,13,13],29:[25,14,14,13,13],30:[26,15,14,14,14],31:[26,15,15,14,14],32:[27,15,15,14,14],33:[28,16,15,15,15],34:[29,16,16,15,15],35:[30,17,16,15,15],36:[30,17,16,16,16],37:[31,18,17,16,16],38:[31,18,17,16,16]};
const KEY='pullup-simple-v2';let audioCtx=null;function unlockAudio(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}function alarm(){try{if(!audioCtx)return;let now=audioCtx.currentTime;let notes=[659,784,988,1318,1047,1175,1318,1568,1318,1568];notes.forEach((freq,i)=>{let at=now+i*0.31;let osc=audioCtx.createOscillator(),harm=audioCtx.createOscillator(),gain=audioCtx.createGain(),harmGain=audioCtx.createGain();osc.type='triangle';osc.frequency.setValueAtTime(freq,at);harm.type='sine';harm.frequency.setValueAtTime(freq*2,at);gain.gain.setValueAtTime(0.0001,at);gain.gain.exponentialRampToValueAtTime(0.14,at+0.025);gain.gain.exponentialRampToValueAtTime(0.0001,at+0.29);harmGain.gain.setValueAtTime(0.0001,at);harmGain.gain.exponentialRampToValueAtTime(0.035,at+0.02);harmGain.gain.exponentialRampToValueAtTime(0.0001,at+0.25);osc.connect(gain);gain.connect(audioCtx.destination);harm.connect(harmGain);harmGain.connect(audioCtx.destination);osc.start(at);harm.start(at);osc.stop(at+0.31);harm.stop(at+0.27)})}catch(e){}}let saved=JSON.parse(localStorage.getItem(KEY)||'null');let s=saved||{week:2,frequency:2,doneByWeek:{},history:[]};let mode='home',setIndex=0,startAt=0,elapsed=0,restLeft=90,timerId=null,session=[],enteredReps='';
const $=x=>document.getElementById(x);const targets=()=>plan[s.week]||[];function persist(){localStorage.setItem(KEY,JSON.stringify(s))}function count(){return (s.doneByWeek[s.week]||[]).length}function showTable(){const t=$('planTable');let out='<thead><tr><th class="label">주차</th>'+Array.from({length:38},(_,i)=>`<th>${i+1}</th>`).join('')+'</tr></thead><tbody>';for(let k=0;k<5;k++){out+=`<tr><td class="label">${k+1}세트</td>`+Array.from({length:38},(_,i)=>{let w=i+1,val=plan[w]?.[k]??'—';return `<td data-w="${w}" data-s="${k}">${val}</td>`}).join('')+'</tr>'}out+='<tr><td class="label">총 횟수</td>'+Array.from({length:38},(_,i)=>{let w=i+1,val=plan[w]?.reduce((a,b)=>a+b,0)??'—';return `<td data-w="${w}" data-s="-">${val}</td>`}).join('')+'</tr></tbody>';t.innerHTML=out;paintTable()}
function paintTable(){document.querySelectorAll('#planTable td').forEach(td=>{let w=+td.dataset.w,k=+td.dataset.s;td.classList.toggle('focus',w===s.week&&(k===setIndex||k===-1&&mode==='overview'));td.classList.toggle('setfocus',w===s.week&&k===setIndex)})}
function base(){return `<div class="progressline"><span class="eyebrow">오늘의 운동 · ${s.week}주차</span><span class="steps">${targets().map((_,i)=>`<i class="${i<=setIndex?'on':''}"></i>`).join('')}</span></div>`}
function draw(){ $('weekBadge').textContent=`${s.week}주차`; $('weekProgress').textContent=`이번 주 성공 ${count()} / ${s.frequency}회`;
let html='';if(mode==='home'){html=`<div class="eyebrow">준비되면 버튼을 눌러주세요</div><h1 class="headline">오늘도 시작하시죠!</h1><p class="desc">오늘 할 세트와 횟수를 하나씩 안내해 드릴게요.</p><button class="circle" id="go"><span class="big">시작</span><span class="small">오늘 운동 시작하기</span></button><div class="records">주 ${s.frequency}회 · 세트 사이 1분 30초 휴식</div>${count()>=s.frequency&&s.week<38?`<button class="btn primary" style="margin-top:16px" id="advanceWeek">다음 주차 시작하기 →</button>`:""}`}
if(mode==='overview'){html=`${base()}<div class="rep-hero"><span>${targets()[setIndex]}</span><small>회</small></div><div class="row"><button class="btn" id="backHome">그만하기</button><button class="btn primary" id="next">다음</button></div>`}
if(mode==='ready'){html=`${base()}<div class="eyebrow">${setIndex+1}세트 · 목표 ${targets()[setIndex]}회</div><h1 class="headline">준비되셨나요?</h1><p class="desc">시작 버튼을 누르면 운동 시간이 올라갑니다.</p><button class="circle" id="startTimer"><span class="big">시작</span><span class="small">준비되면 눌러주세요</span></button><div class="row"><button class="btn" id="backOverview">뒤로</button></div>`}
if(mode==='running'){html=`${base()}<div class="eyebrow">${setIndex+1}세트 · 목표 ${targets()[setIndex]}회</div><h1 class="headline">시작하세요!</h1><div class="timer running" id="clock">00:00</div><p class="desc">편한 속도로, 정자세로 해보세요.</p><button class="finish" id="finish">끝남</button>`}
if(mode==='record'){html=`${base()}<div class="eyebrow">운동 시간 ${fmt(elapsed)}</div><h1 class="headline">몇 회 하셨나요?</h1><p class="desc">목표는 ${targets()[setIndex]}회예요. 아래 숫자를 눌러 실제 횟수를 입력하세요.</p><div class="keypad-display" aria-live="polite"><span id="repDisplay">${enteredReps||'0'}</span><small>회</small></div><div class="keypad">${['1','2','3','4','5','6','7','8','9','clear','0','back'].map(k=>`<button class="key" data-key="${k}" aria-label="${k==='clear'?'지우기':k==='back'?'한 자리 지우기':k+'회'}">${k==='clear'?'지우기':k==='back'?'⌫':k}</button>`).join('')}</div><button class="finish" id="saveSet" ${enteredReps===''?'disabled':''}>기록하고 다음으로</button>`}
if(mode==='rest'){html=`<div class="rest" id="restClock">${fmt(restLeft)}</div><button class="btn primary" id="skipRest" style="min-width:220px">휴식 건너뛰기</button>`}
if(mode==='done'){let ok=session.every(x=>x.ok);html=`<div class="completion">${ok?'🎉':'💪'}</div><h1 class="headline">${ok?'오늘 운동 완료!':'오늘 수고하셨어요!'}</h1><p class="desc">${ok?'5세트 목표를 모두 채웠어요.':'오늘 기록을 저장했어요. 다음 운동에 다시 도전해봐요.'}</p><div class="targetbox"><div style="font-size:20px;font-weight:800">${session.map((x,i)=>`${i+1}세트 ${x.actual}회${x.ok?' ✓':' · 목표 미달'}`).join('<br>')}</div></div><div id="doneMsg" class="note ${ok?'good':'bad'}">${ok?`이번 주 성공 ${count()} / ${s.frequency}회예요.`:'목표 미달 세트가 있어요. 다음 운동도 같은 주차의 같은 5세트 루틴을 반복합니다.'}</div><button class="finish" id="home">${ok?'확인':'같은 루틴으로 다시 시작'}</button>`}
$('screen').innerHTML=html;paintTable();bind();}
function fmt(n){return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}function bind(){document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{let k=b.dataset.key;if(k==='clear')enteredReps='';else if(k==='back')enteredReps=enteredReps.slice(0,-1);else if(enteredReps.length<2)enteredReps+=k;draw()});const on=(id,fn)=>{let e=$(id);if(e)e.onclick=fn};on('go',()=>{unlockAudio();mode='overview';setIndex=0;session=[];draw()});on('advanceWeek',()=>{s.week=Math.min(38,s.week+1);persist();draw()});on('backHome',()=>{mode='home';draw()});on('next',()=>{mode='ready';draw()});on('backOverview',()=>{mode='overview';draw()});on('startTimer',()=>{mode='running';startAt=Date.now();elapsed=0;draw();timerId=setInterval(()=>{elapsed=Math.floor((Date.now()-startAt)/1000);let c=$('clock');if(c)c.textContent=fmt(elapsed)},250)});on('finish',()=>{clearInterval(timerId);timerId=null;elapsed=Math.floor((Date.now()-startAt)/1000);enteredReps='';mode='record';draw()});on('saveSet',()=>{let v=+enteredReps;if(enteredReps===''||v<0)return;let ok=v>=targets()[setIndex];session.push({actual:v,ok,seconds:elapsed});if(setIndex<4){setIndex++;restLeft=90;mode='rest';draw();timerId=setInterval(()=>{if(mode!=='rest'){clearInterval(timerId);return}restLeft=Math.max(0,restLeft-1);let e=$('restClock');if(e)e.textContent=fmt(restLeft);if(!restLeft){clearInterval(timerId);timerId=null;alarm();mode='overview';draw()}},1000)}else{let allOk=session.every(x=>x.ok);if(allOk){s.doneByWeek[s.week]=s.doneByWeek[s.week]||[];s.doneByWeek[s.week].push(Date.now())}else{s.doneByWeek[s.week]=[]}s.history.push({week:s.week,ok:allOk,at:Date.now()});persist();mode='done';draw()}});on('skipRest',()=>{clearInterval(timerId);timerId=null;mode='overview';draw()});on('restToggle',()=>{if(timerId){clearInterval(timerId);timerId=null;$('restToggle').textContent='계속'}else{timerId=setInterval(()=>{restLeft=Math.max(0,restLeft-1);$('restClock').textContent=fmt(restLeft);if(!restLeft){clearInterval(timerId);timerId=null;alarm();mode='overview';draw()}},1000);$('restToggle').textContent='일시정지'}});on('home',()=>{if(session.some(x=>!x.ok)){} mode='home';draw()})}
$('tableToggle').onclick=()=>{$('tableWrap').classList.toggle('tablehidden');$('tableToggle').textContent=$('tableWrap').classList.contains('tablehidden')?'표 펼치기':'표 접기'};$('resetAll').onclick=()=>{if(confirm('전체 진행 기록을 지울까요?')){s={week:2,frequency:2,doneByWeek:{},history:[]};persist();mode='home';draw()}};showTable();draw();
</script></body></html>
